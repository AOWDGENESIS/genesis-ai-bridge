[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "genesis-ai-bridge"
version = "0.1.0"
description = "Local, safety-first bridge between Ollama, OpenClaw and Claude MCP clients"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Genesis AI Bridge contributors"}]
dependencies = []

[project.scripts]
genesis-ai-bridge = "genesis_bridge.__main__:main"
